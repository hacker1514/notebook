name: Build Notebook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: notebook-linux
            output: notebook

          - os: macos-latest
            artifact: notebook-macos
            output: notebook

          - os: windows-latest
            artifact: notebook-windows
            output: notebook.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build Linux/macOS
        if: runner.os != 'Windows'
        run: |
          gcc -Wall -Wextra -std=c99 \
            editor/main.c \
            editor/editor.c \
            editor/platform.c \
            editor/terminal.c \
            editor/screen.c \
            editor/buffer.c \
            editor/file.c \
            editor/cursor.c \
            editor/prompt.c \
            editor/undo.c \
            editor/syntax.c \
            editor/highlight.c \
            editor/search.c \
            editor/theme.c \
            editor/plugins.c \
            editor/clipboard.c \
            editor/command.c \
            editor/help.c \
            -o "${{ matrix.output }}"

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          gcc -Wall -Wextra -std=c99 \
            editor/main.c \
            editor/editor.c \
            editor/platform.c \
            editor/terminal.c \
            editor/screen.c \
            editor/buffer.c \
            editor/file.c \
            editor/cursor.c \
            editor/prompt.c \
            editor/undo.c \
            editor/syntax.c \
            editor/highlight.c \
            editor/search.c \
            editor/theme.c \
            editor/plugins.c \
            editor/clipboard.c \
            editor/command.c \
            editor/help.c \
            -o notebook.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: notebook-linux
          path: bin

      - name: Rename Linux
        run: mv bin/notebook bin/notebook-linux

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: notebook-macos
          path: bin

      - name: Rename macOS
        run: mv bin/notebook bin/notebook-macos

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: notebook-windows
          path: bin

      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bin

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update compiled binaries"
          git push
