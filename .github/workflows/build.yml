name: Build Notebook

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output: notebook-linux
          - os: macos-latest
            output: notebook-macos
          - os: windows-latest
            output: notebook.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          gcc -Wall -Wextra -std=c99 \
            editor/main.c \
            editor/editor.c \
            editor/platform.c \
            editor/terminal.c \
            editor/screen.c \
            editor/buffer.c \
            editor/file.c \
            editor/cursor.c \
            editor/prompt.c \
            editor/undo.c \
            editor/syntax.c \
            editor/highlight.c \
            editor/search.c \
            editor/theme.c \
            editor/plugins.c \
            editor/clipboard.c \
            editor/command.c \
            editor/help.c \
            -o "${{ matrix.output }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          gcc -Wall -Wextra -std=c99 \
            editor/main.c \
            editor/editor.c \
            editor/platform.c \
            editor/terminal.c \
            editor/screen.c \
            editor/buffer.c \
            editor/file.c \
            editor/cursor.c \
            editor/prompt.c \
            editor/undo.c \
            editor/syntax.c \
            editor/highlight.c \
            editor/search.c \
            editor/theme.c \
            editor/plugins.c \
            editor/clipboard.c \
            editor/command.c \
            editor/help.c \
            -o notebook.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

      - name: Copy binary to bin (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          cp "${{ matrix.output }}" "bin/${{ matrix.output }}"

      - name: Copy binary to bin (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item notebook.exe bin\notebook.exe

      - name: Commit binaries
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update compiled binaries"
          file_pattern: bin/*
